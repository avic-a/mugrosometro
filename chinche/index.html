<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;700&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#09120B; --pino:#273C2C; --frambuesa:#82204A;
  --lavanda:#E9E6FF; --musgo:#8FB339; --vino:#690313;
  --manuscrita:'Caveat',cursive;           /* fuente de los títulos */
  --texto:'Nunito',system-ui,sans-serif;
  --codigo:'Inconsolata',ui-monospace,monospace;   /* fuente del cuadro de mensajes */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  color:var(--lavanda);font-family:var(--texto);
  background:
    radial-gradient(60% 45% at 50% 42%,rgba(130,32,74,.5),transparent 72%),
    radial-gradient(120% 80% at 50% 0%,#12200f 0%,var(--noche) 62%);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow:hidden;
}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;gap:12px}
header h1{font:700 1.7rem/1 var(--manuscrita);margin:0}
button{font:700 .9rem var(--texto);color:var(--noche);background:var(--lavanda);border:0;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer}
button:focus-visible{outline:3px solid var(--lavanda);outline-offset:2px}
#coleccion{display:flex;align-items:center;gap:10px}
#puntos{display:flex;gap:4px}
#puntos i{width:8px;height:8px;border-radius:50%;background:rgba(9,18,11,.25)}
#puntos i.on{background:var(--musgo);box-shadow:0 0 0 1.5px var(--noche)}
#cuenta.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}}

#visor{flex:1;min-height:0;position:relative}
#aviso{
  position:absolute;top:10px;left:50%;transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  background:var(--musgo);color:var(--noche);font-weight:700;font-size:.9rem;
  padding:8px 16px;border-radius:999px;white-space:nowrap;transition:opacity .35s,transform .35s;z-index:2
}
#aviso.on{opacity:1;transform:translate(-50%,0)}
#error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;opacity:.85}

.carta{
  margin:8px 16px 4px;border-radius:10px;background:#0E1B12;color:var(--lavanda);
  border:1px solid rgba(233,230,255,.18);box-shadow:0 8px 22px rgba(0,0,0,.45);
  font-family:var(--codigo);overflow:hidden;
}
.carta .barra{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(233,230,255,.07);font-size:.85rem}
.carta .barra i{width:10px;height:10px;border-radius:50%}
.carta .barra i:nth-child(1){background:var(--frambuesa)}
.carta .barra i:nth-child(2){background:var(--musgo)}
.carta .barra i:nth-child(3){background:var(--lavanda)}
.carta .barra span{margin-left:6px;opacity:.7}
.cuerpo{padding:12px 14px 14px;height:8.8rem;overflow:auto;font-size:1.25rem;line-height:1.35}
.pregunta{color:var(--musgo);margin:0 0 6px}
.respuesta{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.respuesta::after{content:"";display:inline-block;width:.55em;height:1.05em;background:var(--lavanda);vertical-align:-.15em;margin-left:2px;animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.carta.brillo{border-color:var(--musgo);box-shadow:0 0 0 1px var(--musgo),0 0 32px rgba(143,179,57,.55)}
.carta.amor{border-color:#c25c8a;box-shadow:0 0 0 1px #c25c8a,0 0 32px rgba(194,92,138,.5)}
@media (prefers-reduced-motion:reduce){.respuesta::after,#cuenta.pop{animation:none}#aviso{transition:none}}
@media (min-width:700px){.carta{max-width:640px;width:calc(100% - 32px);margin-left:auto;margin-right:auto}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

dialog{background:var(--lavanda);color:var(--noche);border:0;border-radius:10px;width:min(92vw,440px);padding:20px;font-family:var(--texto)}
dialog::backdrop{background:rgba(9,18,11,.72)}
dialog h2{margin:0 0 4px;font:700 1.8rem/1 var(--manuscrita)}
dialog ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:10px}
dialog li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.92rem;line-height:1.3}
dialog li b{display:block}
dialog li small{opacity:.7}
dialog li .m{width:18px;height:18px;border-radius:50%;background:#cfcbe6;margin-top:2px}
dialog li.on .m{background:var(--musgo);box-shadow:0 0 0 2px var(--pino)}
dialog button{background:var(--pino);color:var(--lavanda)}
#nota{font-size:.8rem;opacity:.8;margin:0 16px 4px;text-align:center;min-height:1.1em}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<header>
  <h1>Chinche</h1>
  <button id="coleccion" aria-label="Ver secretos descubiertos">
    Secretos <b id="cuenta">0/9</b><span id="puntos" aria-hidden="true"></span>
  </button>
</header>

<section class="carta" id="carta">
  <div class="barra"><i></i><i></i><i></i><span>chinche.txt</span></div>
  <div class="cuerpo">
    <p class="pregunta" id="pregunta"></p>
    <p class="respuesta" id="texto"></p>
  </div>
</section>
<div id="sr" class="sr" aria-live="polite"></div>
<div id="nota"></div>

<div id="visor" role="img" aria-label="Una chinche verde flotando y girando">
  <div id="aviso" role="status"></div>
</div>

<button class="sr" id="tocar">Tocar a la chinche</button>

<dialog id="lista">
  <h2>Secretos</h2>
  <ul id="items"></ul>
  <button id="cerrar">Cerrar</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module">
import { crearVisor } from '../assets/js/visor3d.js';
import { SUPABASE_URL, SUPABASE_KEY, BUCKET, CODIGO } from '../assets/js/config.js';
import { AJUSTES, PREGUNTA, MENSAJES, SECRETOS, HITOS, HORAS, QUINCENA, ANIVERSARIO } from './mensajes.js';

const $ = id => document.getElementById(id);
const IDS = Object.keys(SECRETOS);
const pad = n => String(n).padStart(2, '0');
const pick = a => a[Math.floor(Math.random() * a.length)];
const barajar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Mensajes normales (bolsa sin repetición) ---------- */
const TODOS = Object.entries(MENSAJES).flatMap(([cat, l]) => l.map((texto, i) => ({ id: `${cat}${i}`, texto })));
const porId = new Map(TODOS.map(m => [m.id, m.texto]));

/* ---------- Estado (se guarda en el celular y en Supabase) ---------- */
const vacio = () => ({ v: 1, toques: 0, secretos: {}, bolsa: [], diaEspecial: '', reinicio: 0 });
let estado = vacio();
try { estado = { ...vacio(), ...JSON.parse(localStorage.getItem('chinche-estado') || '{}') }; } catch(e){}

function fusionar(a, b){
  if (!b) return a;
  const ra = a.reinicio || 0, rb = b.reinicio || 0;
  if (ra !== rb) return ra > rb ? a : b;      // un reinicio más reciente gana sobre todo lo anterior
  const r = { ...a, toques: Math.max(a.toques || 0, b.toques || 0), secretos: { ...(b.secretos || {}) } };
  for (const id in (a.secretos || {})) if (!r.secretos[id] || a.secretos[id] < r.secretos[id]) r.secretos[id] = a.secretos[id];
  r.diaEspecial = (a.diaEspecial || '') > (b.diaEspecial || '') ? a.diaEspecial : (b.diaEspecial || '');
  r.bolsa = (b.toques || 0) > (a.toques || 0) ? (b.bolsa || []) : (a.bolsa || []);
  return r;
}

const conectado = !SUPABASE_URL.startsWith('PEGA');
const sb = conectado && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const store = sb ? sb.storage.from(BUCKET) : null;
const ruta = `chinche/${CODIGO}/estado.json`;   // carpeta aparte: "Cambiar fotos" del álbum no la toca

async function cargarRemoto(){
  if (!store) return null;
  try {
    const { data } = await store.list(`chinche/${CODIGO}`, { search: 'estado.json' });
    if (!data || !data.some(f => f.name === 'estado.json')) return null;
    const r = await fetch(store.getPublicUrl(ruta).data.publicUrl + '?t=' + Date.now());
    return r.ok ? await r.json() : null;
  } catch(e){ return null; }
}
let temp;
function guardarLocal(){ try { localStorage.setItem('chinche-estado', JSON.stringify(estado)); } catch(e){} }
async function guardarRemoto(){
  if (!store) return;
  try {
    estado = fusionar(estado, await cargarRemoto());
    guardarLocal(); pintarCuenta();
    const { error } = await store.upload(ruta, new Blob([JSON.stringify(estado)], { type: 'application/json' }),
      { contentType: 'application/json', upsert: true, cacheControl: '0' });
    if (error) throw error;
  } catch(e){ console.warn('No se pudo guardar en Supabase:', e); }
}
function guardarPronto(){ guardarLocal(); clearTimeout(temp); temp = setTimeout(guardarRemoto, 800); }
document.addEventListener('visibilitychange', () => { if (document.hidden) guardarRemoto(); });

/* ---------- Cuenta de secretos ---------- */
$('puntos').innerHTML = IDS.map(() => '<i></i>').join('');
function pintarCuenta(){
  const n = IDS.filter(id => estado.secretos[id]).length;
  $('cuenta').textContent = `${n}/${IDS.length}`;
  [...$('puntos').children].forEach((p, i) => p.classList.toggle('on', !!estado.secretos[IDS[i]]));
}
function registrar(id){
  if (!id || !SECRETOS[id] || estado.secretos[id]) return false;
  estado.secretos[id] = new Date().toISOString();
  return true;
}
let tAviso;
function avisar(t){
  const a = $('aviso'); a.textContent = '✦ Secreto descubierto: ' + t; a.classList.add('on');
  clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('on'), 4200);
  const c = $('cuenta'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
}

/* ---------- Qué responde la chinche ---------- */
function siguienteDeBolsa(){
  let ids = (estado.bolsa || []).filter(id => porId.has(id));
  if (!ids.length) ids = barajar(TODOS.map(m => m.id));
  const id = ids.pop();
  estado.bolsa = ids;
  return porId.get(id);
}
const fechaLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let recientes = [], rafaga = 0, ultimo = 0, bloqueo = 0;

function procesarToque(){
  const ahora = new Date(), ms = ahora.getTime();
  estado.toques++;
  recientes = recientes.filter(t => ms - t < AJUSTES.insistenteSeg * 1000); recientes.push(ms);
  rafaga = (ultimo && ms - ultimo <= AJUSTES.rafagaMs) ? rafaga + 1 : 1; ultimo = ms;

  // 1) Primer toque de un día 15 (el 15 de mayo, aniversario)
  const hoy = fechaLocal(ahora);
  if (ahora.getDate() === QUINCENA.dia && estado.diaEspecial !== hoy){
    estado.diaEspecial = hoy;
    const aniv = ahora.getMonth() + 1 === ANIVERSARIO.mes && ahora.getDate() === ANIVERSARIO.dia;
    const extra = SECRETOS.quincena.mensajes.length ? '\n' + pick(SECRETOS.quincena.mensajes) : '';
    return { id: 'quincena', texto: aniv ? ANIVERSARIO.mensaje : QUINCENA.mensaje + extra, amor: aniv };
  }
  // 2) Horas secretas (11:11, medianoche, 4:44 pm)
  const hhmm = `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`;
  for (const h of HORAS) if (h.horas.includes(hhmm)) return { id: h.id, texto: pick(SECRETOS[h.id].mensajes), brillo: true };
  // 3) Pregunta 100, y comentarios en la 10 y la 50
  if (estado.toques === 100) return { id: 'cien', texto: pick(SECRETOS.cien.mensajes), brillo: true };
  if (HITOS[estado.toques]) return { id: null, texto: HITOS[estado.toques] };
  // 4) Ráfaga de toques rápidos
  if (rafaga >= AJUSTES.rafagaToques){ rafaga = 0; return { id: 'rafaga', texto: pick(SECRETOS.rafaga.mensajes), brillo: true }; }
  // 5) Insistir varias veces en menos de un minuto
  if (recientes.length >= AJUSTES.insistenteToques && ms > bloqueo){
    bloqueo = ms + AJUSTES.insistenteSeg * 1000; recientes = [];
    return { id: 'insistente', texto: pick(SECRETOS.insistente.mensajes), mareo: true };
  }
  // 6) Mensaje brillante al azar
  if (Math.random() < AJUSTES.probDorado) return { id: 'dorado', texto: pick(SECRETOS.dorado.mensajes), brillo: true };
  // 7) Mensaje normal
  return { id: null, texto: siguienteDeBolsa() };
}

/* ---------- Mostrar (el texto se escribe letra por letra) ---------- */
const reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tEscribe = 0;
function escribir(texto){
  clearInterval(tEscribe);
  const el = $('texto');
  $('sr').textContent = texto;
  if (reducir){ el.textContent = texto; return; }
  el.textContent = '';
  let i = 0;
  const paso = texto.length > 90 ? 18 : 30;
  tEscribe = setInterval(() => {
    i++; el.textContent = texto.slice(0, i);
    if (i >= texto.length) clearInterval(tEscribe);
  }, paso);
}
let visor = null;
function mostrar(r){
  const carta = $('carta');
  carta.className = 'carta';
  if (r.amor) carta.classList.add('amor'); else if (r.brillo) carta.classList.add('brillo');
  escribir(r.texto);
  const nuevo = registrar(r.id);
  if (visor){
    if (r.mareo) visor.mareo(1.6);
    if (r.amor) visor.brillo('#E58AB0', 4);
    else if (nuevo || r.brillo) visor.brillo('#C9F26B', 3);
  }
  if (nuevo) avisar(SECRETOS[r.id].titulo);
  pintarCuenta();
  guardarPronto();
}
function tocar(){
  if (visor) visor.agitar();
  mostrar(procesarToque());
}
function mantener(){
  if (visor) visor.agitar(0.5);
  mostrar({ id: 'mantener', texto: pick(SECRETOS.mantener.mensajes), brillo: true });
}
$('tocar').onclick = tocar;

/* ---------- Lista de secretos ---------- */
$('coleccion').onclick = () => {
  $('items').innerHTML = IDS.map(id => {
    const s = SECRETOS[id], f = estado.secretos[id];
    return f
      ? `<li class="on"><span class="m"></span><span><b>${s.titulo}</b><small>Descubierto el ${new Date(f).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' })}</small></span></li>`
      : `<li><span class="m"></span><span><b>???</b><small>${s.pista}</small></span></li>`;
  }).join('');
  $('lista').showModal();
};
$('cerrar').onclick = () => $('lista').close();
$('lista').addEventListener('click', e => { if (e.target === $('lista')) $('lista').close(); });

/* ---------- Reiniciar el conteo (abre esta página con ?reiniciar al final de la dirección) ---------- */
async function reiniciar(){
  if (!confirm('¿Borrar todos los secretos y el conteo de la chinche? Quedará como nueva.')) return;
  estado = { ...vacio(), reinicio: Date.now() };
  guardarLocal();
  if (store){
    const { error } = await store.upload(ruta, new Blob([JSON.stringify(estado)], { type: 'application/json' }),
      { contentType: 'application/json', upsert: true, cacheControl: '0' });
    $('nota').textContent = error ? 'No se pudo reiniciar en Supabase: ' + error.message : 'Listo: la chinche quedó como nueva.';
  } else {
    $('nota').textContent = 'Reiniciado solo en este dispositivo (Supabase no está conectado).';
  }
  pintarCuenta();
}

/* ---------- Inicio ---------- */
$('pregunta').textContent = '> ' + PREGUNTA;
escribir('Toca a la chinche…');
pintarCuenta();
if (!conectado) $('nota').textContent = 'Sin conexión a Supabase: los secretos solo se guardan en este dispositivo.';
(async () => {
  if (new URLSearchParams(location.search).has('reiniciar')){
    await reiniciar();
    history.replaceState(null, '', location.pathname + location.hash);
  }
  try {
    visor = await crearVisor($('visor'), '../assets/modelos/Chinche.glb', { msMantener: AJUSTES.mantenerMs });
    visor.onTocar(tocar);
    visor.onMantener(mantener);
  } catch(e){
    console.error(e);
    $('visor').insertAdjacentHTML('beforeend', '<div id="error">No se pudo cargar el modelo 3D. Toca aquí para ver igual los mensajes.</div>');
    $('visor').onclick = tocar;
  }
  const remoto = await cargarRemoto();
  if (remoto){ estado = fusionar(estado, remoto); guardarLocal(); pintarCuenta(); }
})();
</script>
</body>
</html>
