
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto vacío.</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #252c35;
    font-family: 'IBM Plex Mono', monospace;
    color: #263b55;
    padding: 25px;
}

/* DISQUETE */

.floppy {
    width: 340px;
    max-width: 100%;
    background: #c8c9c3;
    border-radius: 12px 12px 8px 8px;
    padding: 22px 22px 0;
    box-shadow:
        10px 12px 0 #171e28,
        0 20px 45px rgba(0,0,0,.35);
    position: relative;
    overflow: hidden;
}

/* Etiqueta */

.label {
    background: #e9e4d5;
    min-height: 350px;
    padding: 22px 18px;
    border-radius: 3px;
    border: 1px solid #aaa99d;
    position: relative;
}

.top-line {
    height: 8px;
    background: #a33e3e;
    margin: -22px -18px 20px;
}

.system {
    font-size: 9px;
    color: #8a887e;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

h1 {
    font-size: 25px;
    line-height: 1.2;
    margin: 0 0 9px;
    font-weight: 600;
    color: #243d59;
}

.subtitle {
    font-size: 11px;
    color: #a3433e;
    margin-bottom: 35px;
}

.divider {
    border-top: 1px dashed #aaa99d;
    margin-bottom: 22px;
}

.message {
    font-size: 10px;
    line-height: 1.9;
    color: #424b54;
    min-height: 110px;
}

.cursor {
    display: inline-block;
    width: 7px;
    height: 12px;
    background: #a3433e;
    vertical-align: middle;
    animation: blink .8s steps(2) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.footer {
    position: absolute;
    bottom: 15px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    color: #99968a;
    letter-spacing: 1px;
}

/* Parte inferior del disquete */

.disk-bottom {
    height: 65px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.metal {
    width: 100px;
    height: 38px;
    background: linear-gradient(135deg, #777e80, #c5c8c3, #777e80);
    border: 2px solid #8b908e;
    border-radius: 2px;
}

.metal::after {
    content: "";
    display: block;
    width: 30px;
    height: 12px;
    background: #303a43;
    margin: 10px auto;
    border-radius: 2px;
}

.disk-label {
    position: absolute;
    right: 2px;
    bottom: 8px;
    font-size: 7px;
    color: #777e80;
}

</style>
</head>

<body>

<div class="floppy">

    <div class="label">

        <div class="top-line"></div>

        <div class="system">
            SYSTEM FILE // 001
        </div>

        <h1>Proyecto vacío.</h1>

        <div class="subtitle">
            Listo para almacenar.
        </div>

        <div class="divider"></div>

        <div class="message">
            <span id="typed"></span><span class="cursor"></span>
        </div>

        <div class="footer">
            <span>LOVE.EXE</span>
            <span>28.0 KB</span>
        </div>

    </div>

    <div class="disk-bottom">
        <div class="metal"></div>
        <span class="disk-label">3½ FLOPPY DISK</span>
    </div>

</div>

<script>
const message = "Este floppy disk está listo para cualquier idea que se te ocurra. Estoy muy emocionada por ver todo lo que inventas y acompañarte siempre. Felices 28 años, amorcito. Te amo.";

const target = document.getElementById("typed");

let index = 0;

function typeWriter() {
    if (index < message.length) {
        target.textContent += message.charAt(index);
        index++;
        setTimeout(typeWriter, 42);
    }
}

window.addEventListener("load", () => {
    setTimeout(typeWriter, 900);
});
</script>

</body>
</html>
