<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recuerdos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#09120B; --pino:#273C2C; --frambuesa:#82204A;
  --lavanda:#E9E6FF; --musgo:#8FB339; --vino:#690313;
  --sombra-lomo:rgba(39,60,44,.28);
  --lavanda-oscura:#B9B3DE; --gris-lavanda:#7A7596;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 0%,#12200f 0%,var(--noche) 60%);
  color:var(--lavanda);font-family:'Nunito',system-ui,sans-serif;
  display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
header h1{font:700 1.7rem/1 'Caveat',cursive;margin:0}
.count{font-size:.85rem;opacity:.75}
#stage{flex:1;min-height:0;width:min(100%,1040px);margin:0 auto;padding:4px 8px}
footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px 16px;flex-wrap:wrap}
button{font:700 .95rem 'Nunito',sans-serif;color:var(--noche);background:var(--lavanda);border:0;border-radius:999px;padding:11px 18px;cursor:pointer;min-height:44px}
button.main{background:var(--musgo)}
button.ghost{background:transparent;color:var(--lavanda);border:1.5px solid rgba(233,230,255,.35)}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible{outline:3px solid var(--lavanda);outline-offset:2px}
#msg{width:100%;text-align:center;font-size:.85rem;min-height:1.2em;opacity:.9}

/* ---- hojas ---- */
.page{background:var(--lavanda);overflow:hidden;position:relative}
.page.l{background:linear-gradient(to left,var(--sombra-lomo),transparent 9%),var(--lavanda)}
.page.r{background:linear-gradient(to right,var(--sombra-lomo),transparent 9%),var(--lavanda)}
.sheet{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9% 9% 10%}
.num{position:absolute;bottom:3.5%;font:500 1.05rem 'Caveat',cursive;color:var(--gris-lavanda)}
.l .num{left:9%}.r .num{right:9%}

/* acomodo según cuántas fotos tenga la hoja */
.hoja{flex:1;min-height:0;width:100%;display:grid;gap:6%}
.hoja.n1{grid-template-rows:1fr}
.hoja.n2{grid-template-rows:1fr 1fr}
.hoja.n3{grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr}
.hoja.n3 .polaroid:first-child{grid-column:1/-1}
.hoja.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

.polaroid{
  position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;
  background:#fff;padding:4% 4% 13%;
  box-shadow:0 1px 2px rgba(9,18,11,.3),0 6px 14px rgba(9,18,11,.2);
  transform:rotate(var(--rot,0deg));
}
.polaroid img{display:block;flex:1 1 0;min-height:0;width:100%;object-fit:cover;background:var(--lavanda-oscura)}
.polaroid::before{
  content:"";position:absolute;top:-10px;left:50%;width:36%;height:20px;
  background:var(--frambuesa);opacity:.82;transform:translateX(-50%) rotate(-3deg);
}
.vacia{
  flex:1;width:100%;border:2px dashed var(--lavanda-oscura);border-radius:6px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font:500 1.25rem/1.2 'Caveat',cursive;color:var(--gris-lavanda);padding:12%;
}

/* ---- tapas con textura ASCII ---- */
.page.hard{background-color:var(--pino);background-size:cover;background-position:center}
.cover .sheet{color:var(--lavanda);text-align:center;gap:18px}
.cover::after{
  content:"";position:absolute;top:0;right:12%;width:9%;height:32%;background:var(--vino);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);
}
.etiqueta{
  position:relative;background:var(--lavanda);color:var(--noche);padding:18px 24px;border-radius:3px;
  transform:rotate(-2deg);box-shadow:0 3px 8px rgba(9,18,11,.5);
}
.etiqueta::before{
  content:"";position:absolute;top:-12px;left:50%;width:38%;height:22px;
  background:var(--frambuesa);opacity:.9;transform:translateX(-50%) rotate(3deg);
}
.etiqueta b{display:block;font:700 2.3rem/1 'Caveat',cursive}
.cover p{font:500 1.15rem/1.25 'Caveat',cursive;max-width:16ch;margin:0;background:var(--pino);padding:6px 12px;border-radius:2px}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <h1>Recuerdos</h1>
  <span class="count" id="count"></span>
</header>

<div id="stage"></div>

<footer>
  <button class="ghost" id="prev" aria-label="Página anterior">Anterior</button>
  <button class="main" id="change">Cambiar fotos</button>
  <button class="ghost" id="next" aria-label="Página siguiente">Siguiente</button>
  <div id="msg" role="status" aria-live="polite"></div>
</footer>

<input type="file" id="picker" accept="image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== CONFIGURA ESTO ====== */
const SUPABASE_URL = 'https://qfwxfyykhujbpbzqgpwh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cGlhooua2fnOthX4d2lT9g_W8HgPc7j';
/* ============================ */

const HOJAS = 5, POR_HOJA = 4, MAX = HOJAS * POR_HOJA;
const BUCKET = 'recuerdos';
const $ = id => document.getElementById(id);
const say = t => { $('msg').textContent = t; };
let flip = null, sb = null, code = '', total = 0;

/* ---------- Textura ASCII en degradado (se dibuja una vez en un canvas) ---------- */
const RAMP = ' .:-=+*#%@';
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(stops, t){
  const p = Math.min(0.9999, Math.max(0, t)) * (stops.length - 1), i = Math.floor(p), f = p - i;
  const a = hex(stops[i]), b = hex(stops[i + 1]);
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',')})`;
}
function ascii({ bg, stops, abajo = true, seed = 1, cols = 32, rows = 44, cell = 20 }){
  const c = document.createElement('canvas');
  c.width = cols * cell; c.height = rows * cell;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
  g.font = `bold ${cell - 2}px monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const h = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7 + seed * 17) * 43758.5453; return s - Math.floor(s); };
  for (let y = 0; y < rows; y++){
    for (let x = 0; x < cols; x++){
      const gy = abajo ? y / (rows - 1) : 1 - y / (rows - 1);
      const onda = Math.sin(x * .28 + gy * 5 + seed) * .5 + Math.sin(x * .11 - gy * 9) * .5;
      const v = Math.min(1, Math.max(0, gy * .78 + onda * .16 + (h(x, y) - .5) * .22 + .04));
      const ch = RAMP[Math.floor(v * (RAMP.length - 1))];
      if (ch === ' ') continue;
      g.fillStyle = mix(stops, v);
      g.fillText(ch, x * cell + cell / 2, y * cell + cell / 2);
    }
  }
  return c.toDataURL('image/png');
}
const texFrente = () => ascii({ bg: '#273C2C', stops: ['#2f4a36', '#5c7d3c', '#8FB339'], abajo: true, seed: 3 });
const texAtras  = () => ascii({ bg: '#273C2C', stops: ['#2f4a36', '#82204A', '#c25c8a'], abajo: false, seed: 8 });
const texGuarda = () => ascii({ bg: '#E9E6FF', stops: ['#E9E6FF', '#d4cff0', '#B9B3DE'], abajo: true, seed: 5 });

/* ---------- Código del álbum (va en el enlace: #codigo) ---------- */
function getCode(){
  let c = location.hash.slice(1), nuevo = false;
  if (!/^[a-z0-9]{8,40}$/i.test(c)){
    try { c = localStorage.getItem('recuerdos-code') || ''; } catch(e){ c = ''; }
    if (!c){ c = crypto.randomUUID().replace(/-/g, '').slice(0, 16); nuevo = true; }
  }
  try { localStorage.setItem('recuerdos-code', c); } catch(e){}
  history.replaceState(null, '', '#' + c);
  return { c, nuevo };
}

/* ---------- Nube (Supabase Storage) ----------
   Archivos: <codigo>/h1-1.jpg … h5-4.jpg  (hoja-foto) */
const nombre = i => `h${Math.floor(i / POR_HOJA) + 1}-${(i % POR_HOJA) + 1}.jpg`;

async function loadGroups(){
  const store = sb.storage.from(BUCKET);
  const { data, error } = await store.list(code, { limit: 100, sortBy: { column: 'name', order: 'asc' } });
  if (error) throw error;
  const groups = Array.from({ length: HOJAS }, () => []);
  (data || []).forEach(f => {
    const m = /^h([1-5])-([1-4])\.jpg$/.exec(f.name);
    if (!m) return;
    const u = store.getPublicUrl(`${code}/${f.name}`).data.publicUrl;
    groups[m[1] - 1][m[2] - 1] = `${u}?v=${Date.parse(f.updated_at || f.created_at) || 0}`;
  });
  return groups.map(g => g.filter(Boolean));
}

/* Reemplazo total: se borra todo lo anterior y luego se suben las nuevas. */
async function replacePhotos(blobs){
  const store = sb.storage.from(BUCKET);
  const { data } = await store.list(code, { limit: 100 });
  const old = (data || []).filter(f => f.name !== '.emptyFolderPlaceholder').map(f => `${code}/${f.name}`);
  if (old.length){
    const { error } = await store.remove(old);
    if (error) throw error;
  }
  for (let i = 0; i < blobs.length; i++){
    say(`Subiendo foto ${i + 1} de ${blobs.length}…`);
    const { error } = await store.upload(`${code}/${nombre(i)}`, blobs[i],
      { contentType: 'image/jpeg', upsert: true, cacheControl: '3600' });
    if (error) throw error;
  }
}

async function shrink(file){
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k);
  c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

/* ---------- Construir el libro ----------
   0 portada | 1 guarda | 2-6 hojas 1-5 | 7 contraportada  (8 páginas, par) */
const ROT = [-2.2, 1.6, -1.2, 2.2, -1.8, 1.2, 2, -1.4];
let texturas = null;

function build(groups){
  texturas = texturas || { f: texFrente(), a: texAtras(), g: texGuarda() };
  total = groups.reduce((s, g) => s + g.length, 0);
  try { flip && flip.destroy(); } catch(e){}
  flip = null;
  $('stage').innerHTML = '<div id="book"></div>';

  const pages = [];
  pages.push(`<div class="page hard cover" data-density="hard" style="background-image:url(${texturas.f})"><div class="sheet">
      <div class="etiqueta"><b>Recuerdos</b></div>
      <p>Que siempre puedas navegar el mundo sabiéndote querido.</p></div></div>`);
  pages.push(`<div class="page l" style="background-image:linear-gradient(to left,var(--sombra-lomo),transparent 9%),url(${texturas.g});background-size:100% 100%,cover"></div>`);

  for (let h = 0; h < HOJAS; h++){
    const lado = (h + 2) % 2 ? 'l' : 'r';
    const fotos = groups[h] || [];
    const celdas = fotos.map((u, k) =>
      `<div class="polaroid" style="--rot:${ROT[(h * 2 + k) % ROT.length]}deg"><img src="${u}" alt="Hoja ${h + 1}, foto ${k + 1}" draggable="false"></div>`).join('');
    const body = fotos.length
      ? `<div class="hoja n${fotos.length}">${celdas}</div>`
      : `<div class="vacia">Aquí van hasta ${POR_HOJA} fotos</div>`;
    pages.push(`<div class="page ${lado}"><div class="sheet">${body}</div><span class="num">${h + 1}</span></div>`);
  }
  pages.push(`<div class="page hard" data-density="hard" style="background-image:url(${texturas.a})"></div>`);

  $('book').innerHTML = pages.join('');
  flip = new St.PageFlip($('book'), {
    width: 320, height: 440, size: 'stretch',
    minWidth: 240, maxWidth: 520, minHeight: 330, maxHeight: 720,
    showCover: true, maxShadowOpacity: .45, flippingTime: 700,
    usePortrait: true, mobileScrollSupport: false
  });
  flip.loadFromHTML($('book').querySelectorAll('.page'));
  $('count').textContent = `${total} de ${MAX} fotos`;
}

/* ---------- Eventos ---------- */
$('prev').onclick = () => flip && flip.flipPrev();
$('next').onclick = () => flip && flip.flipNext();
$('change').onclick = () => {
  if (!sb){ say('Falta conectar Supabase: pega tu URL y tu clave en el archivo.'); return; }
  $('picker').click();
};

$('picker').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  if (total && !confirm(`Se van a reemplazar las ${total} fotos actuales. ¿Continuar?`)) return;

  $('change').disabled = true;
  try {
    say('Preparando fotos…');
    const blobs = [];
    let fallos = 0;
    for (const f of files.slice(0, MAX)){
      try { blobs.push(await shrink(f)); } catch(err){ fallos++; }
    }
    if (!blobs.length){ say('No se pudo leer ninguna foto. Prueba con JPG o PNG.'); return; }

    await replacePhotos(blobs);
    build(await loadGroups());

    let nota = `Listo: ${blobs.length} fotos guardadas, ${POR_HOJA} por hoja en el orden que las elegiste.`;
    if (files.length > MAX) nota += ` Solo caben ${MAX}; usé las primeras ${MAX}.`;
    if (fallos) nota += ` ${fallos} no se pudieron leer.`;
    say(nota);
  } catch(err){
    console.error(err);
    say('No se pudieron guardar las fotos. Revisa tu conexión e inténtalo de nuevo.');
  } finally {
    $('change').disabled = false;
  }
};

/* ---------- Inicio ---------- */
(async () => {
  if (SUPABASE_URL.startsWith('PEGA')){
    build([]);
    say('Falta conectar Supabase: pega tu URL y tu clave en el archivo.');
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const r = getCode();
  code = r.c;
  build([]);
  say('Cargando recuerdos…');
  try {
    const groups = await loadGroups();
    build(groups);
    if (r.nuevo) say('Álbum nuevo. Sube las fotos y luego graba este enlace en el NFC.');
    else if (!total) say(`Toca «Cambiar fotos» para elegir hasta ${MAX}.`);
    else say('');
  } catch(err){
    console.error(err);
    say('No se pudo cargar el álbum. Revisa tu conexión.');
  }
})();
</script>
</body>
</html>
